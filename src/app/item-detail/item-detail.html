@if (notFound) {
  <div class="alert alert-warning text-center">
    <h4>Item not found.</h4>
    <a routerLink="/items" class="btn btn-primary mt-2">Back to Catalog</a>
  </div>
} @else if (item) {
  <nav aria-label="breadcrumb" class="mb-4">
    <ol class="breadcrumb">
      <li class="breadcrumb-item"><a routerLink="/items">Catalog</a></li>
      <li class="breadcrumb-item active">{{ item.name }}</li>
    </ol>
  </nav>

  <div class="card shadow-sm">
    <div class="card-body p-4">
      <div class="d-flex justify-content-between align-items-start flex-wrap gap-2 mb-3">
        <div>
          <span class="badge bg-info text-dark me-2">{{ item.category }}</span>
          @if (item.inStock) {
            <span class="badge bg-success">In Stock</span>
          } @else {
            <span class="badge bg-danger">Out of Stock</span>
          }
        </div>
        <span class="fs-4 fw-bold text-primary">\${{ item.price | number:'1.2-2' }}</span>
      </div>

      <h2 class="card-title mb-3">{{ item.name }}</h2>
      <p class="card-text text-muted lead">{{ item.description }}</p>

      <hr />
      <div class="d-flex gap-2 mt-3">
        <button class="btn btn-primary" [disabled]="!item.inStock">
          {{ item.inStock ? 'Add to Cart' : 'Notify Me' }}
        </button>
        <a routerLink="/items" class="btn btn-outline-secondary">Back to Catalog</a>
      </div>
    </div>
  </div>
} @else {
  <div class="text-center py-5">
    <div class="spinner-border text-primary" role="status">
      <span class="visually-hidden">Loading...</span>
    </div>
  </div>
}
